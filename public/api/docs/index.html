<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextOlymp — Swagger REST API Hujjatlari</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0b1329;
      font-family: 'Inter', sans-serif;
      color: #e2e8f0;
    }
    .top-bar {
      background: #070d1e;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      text-decoration: none;
    }
    .brand img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }
    .badge {
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.4);
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
    }
    .back-btn {
      color: #94a3b8;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }
    .back-btn:hover {
      color: #ffffff;
    }
    /* Swagger UI Theme Enhancements */
    .swagger-ui .topbar { display: none; }
    .swagger-ui {
      background: #0b1329;
      color: #cbd5e1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }
    .swagger-ui .info .title {
      color: #ffffff !important;
    }
    .swagger-ui .info p, .swagger-ui .info li {
      color: #94a3b8 !important;
    }
    .swagger-ui .scheme-container {
      background: #0f172a;
      box-shadow: none;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .swagger-ui .opblock {
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
      margin-bottom: 16px;
    }
    .swagger-ui .opblock .opblock-summary {
      padding: 12px 16px;
    }
    .swagger-ui .opblock .opblock-summary-method {
      border-radius: 8px;
      font-weight: 700;
    }
    .swagger-ui .opblock-body {
      background: #0f172a;
    }
    .swagger-ui table thead tr th, .swagger-ui table thead tr td {
      color: #e2e8f0;
      border-color: rgba(255, 255, 255, 0.1);
    }
    .swagger-ui table tbody tr td {
      color: #cbd5e1;
      border-color: rgba(255, 255, 255, 0.05);
    }
    .swagger-ui .response-col_status {
      color: #38bdf8;
    }
    .swagger-ui .btn.execute {
      background-color: #4f46e5;
      border-color: #4f46e5;
      color: #ffffff;
      border-radius: 8px;
      font-weight: 600;
    }
    .swagger-ui .btn.try-out__btn {
      border-radius: 8px;
      border-color: #64748b;
      color: #cbd5e1;
    }
    .swagger-ui section.models {
      border-color: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      background: #0f172a;
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <a href="/" class="brand">
      <img src="/logo.png" alt="NextOlymp Logo" onerror="this.src='/favicon.svg'">
      <span>NextOlymp API</span>
      <span class="badge">MySQL Live</span>
    </a>
    <a href="/" class="back-btn">← Platformaga qaytish</a>
  </header>

  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
  <script>
    window.onload = () => {
      window.ui = SwaggerUIBundle({
        url: '/api/swagger.json',
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIBundle.SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout"
      });
    };
  </script>
</body>
</html>
